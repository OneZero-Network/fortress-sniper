name: Fortress Crypto Daily Sniper

on:
  schedule:
    # 00:15 UTC daily — crypto trades 24/7, so this just needs to be a
    # consistent daily anchor (not tied to any exchange close, unlike NSE).
    - cron: '15 0 * * *'
  workflow_dispatch: {}

concurrency:
  group: fortress-crypto-daily
  cancel-in-progress: true

jobs:
  crypto-sniper:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Restore crypto DB cache
        uses: actions/cache@v4
        with:
          path: outputs/fortress_unified.db
          # Keyed by day so ignitions/pearls persist across today's runs;
          # falls back to the most recent available DB from any prior day
          # if today's key doesn't exist yet (first run of the day).
          key: fortress-crypto-db-${{ github.run_id }}
          restore-keys: |
            fortress-crypto-db-

      - name: Run Crypto Sniper daily ignition scan
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GOOGLE_SHEET_ID: ${{ secrets.GOOGLE_SHEET_ID }}
          GOOGLE_CREDS_JSON: ${{ secrets.GOOGLE_CREDS_JSON }}
          COINGECKO_API_KEY: ${{ secrets.COINGECKO_API_KEY }}
          ETHERSCAN_API_KEY: ${{ secrets.ETHERSCAN_API_KEY }}
          BSCSCAN_API_KEY: ${{ secrets.BSCSCAN_API_KEY }}
          POLYGONSCAN_API_KEY: ${{ secrets.POLYGONSCAN_API_KEY }}
        run: python workflows/sniper_daily_crypto.py

      - name: Upload run artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: crypto-sniper-run-${{ github.run_id }}
          path: outputs/
          retention-days: 30
