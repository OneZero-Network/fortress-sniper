name: Fortress Crypto Backtest (SIMULATED, manual only)

on:
  workflow_dispatch: {}
  # DELIBERATELY no schedule trigger — this is a heavier research tool
  # (fetches ~240 days of history per coin, then replays technical
  # scoring logic day-by-day). Run it manually when you want a fresh
  # simulated read, not on a fixed cadence.

concurrency:
  group: fortress-crypto-backtest
  cancel-in-progress: true

jobs:
  crypto-backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run backtest (SIMULATED — technical core only)
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          COINGECKO_API_KEY: ${{ secrets.COINGECKO_API_KEY }}
        run: python scripts/backtest_crypto.py

      - name: Upload run artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: crypto-backtest-run-${{ github.run_id }}
          path: outputs/
          retention-days: 30
