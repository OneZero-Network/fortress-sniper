name: Fortress Crypto Weekly Incubator

on:
  schedule:
    # Sunday 00:30 UTC — mirrors the equity Incubator's "Sunday night"
    # weekly cadence philosophy (slower thesis-building signal, see
    # core/crypto/config.py INCUBATOR_CADENCE docstring for reasoning).
    - cron: '30 0 * * 0'
  workflow_dispatch: {}

concurrency:
  group: fortress-crypto-weekly
  cancel-in-progress: true

jobs:
  crypto-incubator:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run Crypto Incubator weekly pearl scan
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GOOGLE_SHEET_ID: ${{ secrets.GOOGLE_SHEET_ID }}
          GOOGLE_CREDS_JSON: ${{ secrets.GOOGLE_CREDS_JSON }}
          COINGECKO_API_KEY: ${{ secrets.COINGECKO_API_KEY }}
          ETHERSCAN_API_KEY: ${{ secrets.ETHERSCAN_API_KEY }}
          BSCSCAN_API_KEY: ${{ secrets.BSCSCAN_API_KEY }}
          POLYGONSCAN_API_KEY: ${{ secrets.POLYGONSCAN_API_KEY }}
        run: python workflows/incubator_weekly_crypto.py

      - name: Upload run artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: crypto-incubator-run-${{ github.run_id }}
          path: outputs/
          retention-days: 30
