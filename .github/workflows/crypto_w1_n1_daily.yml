name: Fortress Crypto W1/N1 Observation Logger

on:
  schedule:
    # DAILY — this MUST run on a schedule, not just manually. Unlike F1
    # (backtestable now), W1/N1 need to accumulate real forward-return
    # observations day by day. Skipping days means gaps in the dataset.
    - cron: '45 0 * * *'
  workflow_dispatch: {}

concurrency:
  group: fortress-crypto-w1n1
  cancel-in-progress: true

jobs:
  w1n1-observe:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Restore crypto DB cache
        uses: actions/cache@v4
        with:
          path: outputs/fortress_unified.db
          key: fortress-crypto-db-${{ github.run_id }}
          restore-keys: |
            fortress-crypto-db-

      - name: Run W1/N1 observation logger
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          COINGECKO_API_KEY: ${{ secrets.COINGECKO_API_KEY }}
          CRYPTOPANIC_API_KEY: ${{ secrets.CRYPTOPANIC_API_KEY }}
          ETHERSCAN_API_KEY: ${{ secrets.ETHERSCAN_API_KEY }}
          BSCSCAN_API_KEY: ${{ secrets.BSCSCAN_API_KEY }}
          POLYGONSCAN_API_KEY: ${{ secrets.POLYGONSCAN_API_KEY }}
        run: python scripts/experiment_w1_n1_observe.py

      - name: Upload run artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: w1n1-run-${{ github.run_id }}
          path: outputs/
          retention-days: 30
