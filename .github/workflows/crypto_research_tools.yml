name: Fortress Crypto Research Tools (manual only)

on:
  workflow_dispatch:
    inputs:
      script:
        description: 'Which research tool to run (or "all" to run every tool sequentially in one go)'
        required: true
        type: choice
        default: 'all'
        options:
          - all
          - backtest_matrix
          - v5_falsification_test
          - regime_audit_v1
          - f1_false_pearl
          - regime_v2_calibration

concurrency:
  group: fortress-crypto-research-tools
  cancel-in-progress: true

jobs:
  run-research-tool:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Restore crypto DB cache
        uses: actions/cache@v4
        with:
          path: outputs/fortress_unified.db
          key: fortress-crypto-db-${{ github.run_id }}
          restore-keys: |
            fortress-crypto-db-

      - name: Run selected research tool(s)
        # When "all" is chosen, every tool runs sequentially in this ONE
        # step, each reported to Telegram exactly as it would standalone.
        # A failure in one tool does NOT stop the rest (set -e is
        # deliberately NOT used) — you get every result that's possible
        # to get in one pass, plus a clear PASS/FAIL summary at the end,
        # rather than one crash silently cancelling four other tools'
        # worth of results.
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          COINGECKO_API_KEY: ${{ secrets.COINGECKO_API_KEY }}
          CRYPTOPANIC_API_KEY: ${{ secrets.CRYPTOPANIC_API_KEY }}
          ETHERSCAN_API_KEY: ${{ secrets.ETHERSCAN_API_KEY }}
          BSCSCAN_API_KEY: ${{ secrets.BSCSCAN_API_KEY }}
          POLYGONSCAN_API_KEY: ${{ secrets.POLYGONSCAN_API_KEY }}
        run: |
          declare -A SCRIPTS=(
            [backtest_matrix]="scripts/backtest_crypto.py"
            [v5_falsification_test]="scripts/backtest_v5.py"
            [regime_audit_v1]="scripts/regime_audit_v1.py"
            [f1_false_pearl]="scripts/experiment_f1_false_pearl.py"
            [regime_v2_calibration]="scripts/calibrate_regime_v2.py"
          )

          run_one() {
            local name="$1"
            local path="${SCRIPTS[$name]}"
            echo "::group::Running $name ($path)"
            if python "$path"; then
              echo "✅ $name completed"
              RESULTS+=("✅ $name")
            else
              echo "❌ $name FAILED (see log above) — continuing to next tool"
              RESULTS+=("❌ $name (FAILED)")
            fi
            echo "::endgroup::"
          }

          RESULTS=()
          SELECTION="${{ inputs.script }}"

          if [ "$SELECTION" = "all" ]; then
            for name in backtest_matrix v5_falsification_test regime_audit_v1 f1_false_pearl regime_v2_calibration; do
              run_one "$name"
            done
          elif [ -n "${SCRIPTS[$SELECTION]}" ]; then
            run_one "$SELECTION"
          else
            echo "Unknown script selection: $SELECTION"
            exit 1
          fi

          echo ""
          echo "=== SUMMARY ==="
          printf '%s\n' "${RESULTS[@]}"

      - name: Upload run artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: research-tools-${{ inputs.script }}-${{ github.run_id }}
          path: outputs/
          retention-days: 30

