name: Fortress Crypto Slipstream Discovery Proof (hourly)

on:
  schedule:
    # v4.9.28 — now runs hourly, per explicit request, rather than
    # manual-only. Deliberately offset from both the main pipeline
    # (:15) and the chain-discovery-only job (:05/:20/:35/:50) to avoid
    # any risk of overlapping RPC/database access.
    - cron: '40 * * * *'
  workflow_dispatch: {}

concurrency:
  group: fortress-crypto-slipstream-proof
  cancel-in-progress: true

jobs:
  slipstream-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Restore crypto DB cache
        uses: actions/cache@v4
        with:
          path: outputs/fortress_unified.db
          key: fortress-crypto-db-${{ github.run_id }}
          restore-keys: |
            fortress-crypto-db-

      - name: Run Slipstream Discovery Proof
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python scripts/slipstream_discovery_proof.py
