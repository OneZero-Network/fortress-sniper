name: Fortress Crypto Slipstream Discovery Proof (weekly health-check)

on:
  schedule:
    # v4.9.31 — DEMOTED from hourly to weekly, per direct feedback: "same
    # token again and again." This tool replays a FIXED set of 10
    # historical events forever — it already proved the decoder works
    # (10/10, confirmed multiple times). It was never meant to find new
    # tokens; the ONLY thing it can ever report is whether that same
    # proof still passes. Re-confirming that hourly, forever, adds
    # nothing and was the wrong call to push to the main feed that often.
    # Weekly is more than enough for "did something break since last
    # time" — actual new-token discovery lives in
    # crypto_chain_discovery_only.yml (every 15 min) and
    # crypto_base_discovery.yml (hourly), both of which only message
    # when something genuinely new is found.
    - cron: '40 6 * * 1'
  workflow_dispatch: {}

concurrency:
  group: fortress-crypto-slipstream-proof
  cancel-in-progress: true

jobs:
  slipstream-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Restore crypto DB cache
        uses: actions/cache@v4
        with:
          path: outputs/fortress_unified.db
          key: fortress-crypto-db-${{ github.run_id }}
          restore-keys: |
            fortress-crypto-db-

      - name: Run Slipstream Discovery Proof
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python scripts/slipstream_discovery_proof.py
